[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buc1514-ssrf"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告代理层的请求伪造风险相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "buc1514" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://buc1514.github.io"
Repository = "https://github.com/buc1514/ssrf"
Issues = "https://github.com/buc1514/ssrf/issues"

[project.scripts]
ssrf = "ssrf:main"

[tool.setuptools]
py-modules = ["ssrf"]
